spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mail}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:ashrithbalajigudla@gmail.com}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
            required: ${SMTP_STARTTLS_REQUIRED:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
brevo:
  api:
    key: ${BREVO_API_KEY:}
  from:
    email: ${BREVO_FROM_EMAIL:ashrithbalajigudla@gmail.com}
    name: ${BREVO_FROM_NAME:Gudla Ashrith Balaji}
app:
  mail:
    provider: ${MAIL_PROVIDER:AUTO}
