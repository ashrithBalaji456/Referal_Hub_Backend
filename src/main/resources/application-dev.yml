    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:ashrithbalajigudla@gmail.com}
    password: ${SMTP_PASSWORD:nwlirylwtdrljndw}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true
          ssl:
            trust: "*"