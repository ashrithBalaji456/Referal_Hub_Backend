spring:
  application:
    name: referral-outreach-manager
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mail}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Kolkata
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:ashrithbalajigudla@gmail.com}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
            required: ${SMTP_STARTTLS_REQUIRED:true}
          ssl:
            trust: ${SMTP_SSL_TRUST:*}
            protocols: TLSv1.2 TLSv1.3
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

brevo:
  api:
    key: ${BREVO_API_KEY:}
  from:
    email: ${BREVO_FROM_EMAIL:ashrithbalajigudla@gmail.com}
    name: ${BREVO_FROM_NAME:Gudla Ashrith Balaji}

app:
  mail:
    provider: ${MAIL_PROVIDER:AUTO} # AUTO (uses Brevo if BREVO_API_KEY set, else SMTP), BREVO, or SMTP
  upload:
    dir: ${UPLOAD_DIR:./uploads/resumes}
  scheduler:
    cron: "0 0 9 * * MON" # Default: Every Monday at 9:00 AM
    cooldown-days: 30 # Prevent duplicate outreach for 30 days
  candidate-name: ${CANDIDATE_NAME:Gudla Ashrith Balaji}
  target-role: ${TARGET_ROLE:Java Backend Developer}
